# Дашборд-фронт: SPA + прокси API-путей на backend-сервис `server:4000`.
# Набор путей — как в vite-dev-прокси кабинета (graphql/auth/scrape/...).
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Блог-райтер принимает картинки и видео; контроллер разрешает до 100 МБ, а
  # парсер тела в main.ts — до 80 МБ, так что 25 МБ здесь были самым узким
  # местом и резали загрузку раньше всех, отдавая 413 без внятной причины.
  client_max_body_size 80m;

  # Фронт кабинета зовёт трекер по историческому префиксу /scrape/* — в
  # исходном продукте там стоял отдельный python-сервис. В этой сборке те же
  # эндпоинты отдаёт NestJS на /api/public/*, поэтому /scrape/* без переписи
  # уходил в 404, и дашборд трекера не мог загрузить ни строки данных.
  # Переписываем на стороне nginx, чтобы не трогать parity-порт контроллеров.
  location ^~ /scrape/ {
    rewrite ^/scrape/(.*)$ /api/public/$1 break;
    proxy_pass http://server:4000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_read_timeout 300s;
  }

  # API → backend (те же пути, что фронт зовёт same-origin)
  location ~ ^/(graphql|auth|tg|scrape|blogwriter|metrika|gsc|cloudflare|threads|linkedin|x|assistant|api)(/|$) {
    proxy_pass http://server:4000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_read_timeout 300s;
  }

  # SPA-роутинг
  location / {
    try_files $uri $uri/ /index.html;
  }
}
