# Дашборд-фронт: SPA + прокси API-путей на backend-сервис `server:4000`.
# Набор путей — как в vite-dev-прокси кабинета (graphql/auth/scrape/...).
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  client_max_body_size 25m;

  # API → backend (те же пути, что фронт зовёт same-origin)
  location ~ ^/(graphql|auth|tg|scrape|blogwriter|metrika|gsc|cloudflare|threads|linkedin|x|assistant|api)(/|$) {
    proxy_pass http://server:4000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_read_timeout 300s;
  }

  # SPA-роутинг
  location / {
    try_files $uri $uri/ /index.html;
  }
}
